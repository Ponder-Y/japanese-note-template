<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="可重用的日文筆記文件站模板" />
  <title>日本語筆記</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-button mobile-only" id="menuButton" aria-label="開啟目錄" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="./" aria-label="日本語筆記首頁">
        <span class="brand-mark">上</span>
        <span class="brand-text">日本語筆記</span>
      </a>

      <button class="search-trigger" id="searchTrigger" aria-label="搜尋筆記">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <span>Search</span>
        <kbd id="shortcutHint">⌘ K</kbd>
      </button>

      <nav class="topnav desktop-only" aria-label="主要導覽">
        <a id="feedbackLink" href="#feedback">意見回饋</a>
        <a href="?note=note-template">文法筆記</a>
        <a href="?note=vocabulary-template">單字練習</a>
      </nav>

      <button class="icon-button" id="themeButton" aria-label="切換深淺色">
        <svg class="theme-icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <div class="docs-layout">
    <aside class="sidebar" id="sidebar" aria-label="筆記目錄">
      <div class="sidebar-scroll" id="sidebarContent"></div>
    </aside>

    <main class="main-column">
      <article class="article" id="article"></article>
    </main>

    <aside class="toc-column" aria-label="本頁目錄">
      <div class="toc-sticky">
        <div class="toc-title">On this page</div>
        <nav class="toc" id="toc"></nav>
      </div>
    </aside>
  </div>

  <dialog class="search-dialog" id="searchDialog" aria-label="搜尋筆記">
    <div class="search-panel">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="searchInput" type="search" placeholder="搜尋標題、內容或關鍵字…" autocomplete="off" />
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="searchResults" role="listbox"></div>
      <div class="search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> 選擇</span>
        <span><kbd>Enter</kbd> 開啟</span>
      </div>
    </div>
  </dialog>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
